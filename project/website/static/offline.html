<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0c">
  <title>Itihaas — offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 30%, #3a1a0e 0%, #0c0c0c 60%);
      color: #fff7ee; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-family: Georgia, serif; font-size: 1.8rem; margin: 18px 0 6px; color: #f1683a; }
    p { margin: 0 auto 20px; max-width: 30ch; color: #e8d9cc; }
    button {
      background: #f1683a; color: #fff; border: 0; border-radius: 999px;
      padding: 12px 28px; font: inherit; font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Itihaas needs a connection to load monuments, bookings and the shop. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
